name: "CloudRDP [10:57:29] - Ubuntu Instance"
on:
  workflow_dispatch:
jobs:
  rdp-instance:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Setup XFCE and XRDP
        run: |
          set -x
          #!/bin/bash
          
          # CloudRDP Automated Setup Script
          # Description: Installs XFCE4 and XRDP for a remote desktop experience.
          # Compatibility: Ubuntu 20.04+, Debian 11+
          
          export DEBIAN_FRONTEND=noninteractive
          
          echo "--- [1/6] Initializing System ---"
          sudo apt-get update -qy
          sudo apt-get install -y software-properties-common
          
          echo "--- [2/6] Installing Desktop Environment (XFCE4) ---"
          sudo apt-get install -y xfce4 xfce4-goodies dbus-x11
          
          echo "--- [3/6] Installing and Configuring XRDP ---"
          sudo apt-get install -y xrdp xorgxrdp
          
          # Configure XRDP to use XFCE
          echo "exec startxfce4" > ~/.xsession
          chmod +x ~/.xsession
          
          # Force XFCE even if Gnome is present (System-wide)
          sudo tee /etc/xrdp/startwm.sh <<EOF
          #!/bin/sh
          if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG
          fi
          
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec startxfce4
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh
          
          # Allow any user to start X server
          sudo bash -c 'echo "allowed_users=anybody" > /etc/X11/Xwrapper.config'
          
          echo "--- [4/6] Optimizing Security & Performance ---"
          # Fix for Polkit (Avoids authorization popups in RDP)
          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d/
          sudo bash -c 'cat <<EOF > /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla
          [Allow Colord all Users]
          Identity=unix-user:*
          Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
          ResultAny=no
          ResultInactive=no
          ResultActive=yes
          EOF'
          
          # Set XRDP User Permissions and SSL
          sudo apt-get install -y ssl-cert
          sudo adduser xrdp ssl-cert
          
          # Force Standard RDP Security (Fixes "Hanging" on connection)
          sudo sed -i 's/^max_bpp=.*/max_bpp=24/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^security_layer=.*/security_layer=rdp/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^crypt_level=.*/crypt_level=none/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^bitmap_cache=.*/bitmap_cache=yes/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^bitmap_compression=.*/bitmap_compression=yes/' /etc/xrdp/xrdp.ini
          
          echo "--- [5/6] Finalizing Services ---"
          sudo service xrdp restart
          sudo ufw allow 3389/tcp 2>/dev/null || true
          
          echo "--- [6/6] Setting Credentials ---"
          # Default credentials for the session
          echo "runner:CloudRDP2026!" | sudo chpasswd
          echo "root:CloudRDP2026!" | sudo chpasswd
          
          echo "CloudRDP: Setup Complete. Listening on 3389."
          
          
          
          echo "--- Starting Tmate Setup ---"
          sudo apt-get update -qy
          sudo apt-get install -y tmate
          
          echo "--- Launching Tmate ---"
          tmate -S /tmp/tmate.sock new-session -d
          until [ -S /tmp/tmate.sock ]; do sleep 1; done
          
          export TMATE_SSH=""
          for i in {1..30}; do
            TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || echo "")
            if [[ "$TMATE_SSH" == *"tmate.io"* ]]; then 
              TMATE_SSH=$(echo $TMATE_SSH | sed 's/^ssh //')
              break
            fi
            echo "Waiting for Tmate SSH (attempt $i/30)..."
            sleep 2
          done
          
          if [ -z "$TMATE_SSH" ]; then 
            echo "::error::Failed to get Tmate SSH after 60 seconds"
            exit 1
          fi
          
          echo "------------------------------------------"
          echo "TMATE SSH: $TMATE_SSH"
          echo "COMMAND: ssh -L 3390:localhost:3389 $TMATE_SSH"
          echo "REPORTING TO: https://clean-cows-ask.loca.lt"
          echo "------------------------------------------"
          
          # Report back to Fleet Automator
          REPORT_URL="https://clean-cows-ask.loca.lt/instance/44b7410d-44d7-42eb-9e4a-d365e1380064/report"
          echo "Reporting to $REPORT_URL..."
          curl -s -X POST "$REPORT_URL"             -H "Content-Type: application/json"             -d "{\"ip_address\": \"$TMATE_SSH\"}" && echo "Reported successfully!" || echo "Report failed - check BACKEND_URL"
          
          # Keep Alive
          echo "Instance active. Staying alive for 6 hours..."
          sleep 21600
