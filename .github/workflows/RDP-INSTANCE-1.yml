name: "CloudRDP [14:03:02] - Ubuntu Instance"
on:
  workflow_dispatch:
jobs:
  rdp-instance:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Setup XFCE and XRDP
        run: |
          set -x
          #!/bin/bash
          
          # CloudRDP Nuclear Setup Script (Hyper-Stable V4 - Ubuntu 22.04 Optimized)
          export DEBIAN_FRONTEND=noninteractive
          
          echo "--- [1/4] Installing Core Components ---"
          sudo apt-get update -qy
          # Install XFCE, XRDP, and Xorg backend
          sudo apt-get install -y xfce4 xfce4-goodies xrdp xorgxrdp tmate dbus-x11 x11-xserver-utils
          
          # Configure User Session
          USER_HOME=$(eval echo "~$(whoami)")
          echo "exec dbus-launch --exit-with-session startxfce4" > $USER_HOME/.xsession
          chmod +x $USER_HOME/.xsession
          chown $(whoami):$(whoami) $USER_HOME/.xsession
          
          # CRITICAL: Robust startwm.sh
          sudo tee /etc/xrdp/startwm.sh <<EOF
          #!/bin/sh
          if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG
          fi
          
          # Essential environment cleanup
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          unset XDG_SESSION_ID
          
          # Start XFCE session with DBUS launch
          if [ -x /usr/bin/startxfce4 ]; then
            exec dbus-launch --exit-with-session startxfce4
          fi
          
          exec /bin/sh /etc/X11/Xsession
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh
          
          # Fix for 'Configuring remote session' hang: 
          sudo service xrdp stop 2>/dev/null || true
          sudo rm -f /var/run/xrdp.pid /var/run/xrdp-sesman.pid
          
          # Hardening xrdp.ini
          sudo sed -i 's/^security_layer=.*/security_layer=negotiate/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^crypt_level=.*/crypt_level=high/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^max_bpp=.*/max_bpp=32/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^#tcp_send_buffer_size=.*/tcp_send_buffer_size=32768/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^#tcp_recv_buffer_size=.*/tcp_recv_buffer_size=32768/' /etc/xrdp/xrdp.ini
          
          # Generate a fresh certificate
          sudo openssl req -x509 -newkey rsa:2048 -nodes -keyout /etc/xrdp/key.pem -out /etc/xrdp/cert.pem -days 365 -subj "/C=US/ST=NY/L=NY/O=CloudRDP/CN=localhost" 2>/dev/null
          sudo chown xrdp:xrdp /etc/xrdp/key.pem /etc/xrdp/cert.pem
          
          # Group permissions
          sudo adduser xrdp ssl-cert 2>/dev/null || true
          sudo adduser xrdp shadow 2>/dev/null || true
          sudo adduser xrdp video 2>/dev/null || true
          sudo adduser xrdp render 2>/dev/null || true
          sudo adduser $(whoami) ssl-cert 2>/dev/null || true
          
          # Allow any user to start X server
          sudo bash -c 'echo "allowed_users=anybody" > /etc/X11/Xwrapper.config'
          
          # Fix Ubuntu 22.04 Color Manager & Refresh Rate hangs
          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d/
          sudo tee /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla <<EOF
          [Allow Colord]
          Identity=unix-user:*
          Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
          ResultAny=no
          ResultInactive=no
          ResultActive=yes
          EOF
          
          echo "--- [2/4] Finalizing Services ---"
          sudo systemctl enable xrdp
          sudo service xrdp restart
          sudo service xrdp-sesman restart
          
          # Wait for XRDP to actually start listening
          echo "Waiting for XRDP to listen on 3389..."
          for i in {1..10}; do
            if netstat -ant | grep -q ":3389 .* LISTEN"; then
              echo "âœ… XRDP is listening!"
              break
            fi
            sleep 2
          done
          
          echo "--- [3/4] Setting Credentials ---"
          CURRENT_USER=$(whoami)
          echo "$CURRENT_USER:CloudRDP2026!" | sudo chpasswd
          echo "root:CloudRDP2026!" | sudo chpasswd
          
          echo "--- [4/4] Diagnostic Check ---"
          sudo systemctl status xrdp --no-pager | grep "Active:"
          echo "CloudRDP: Hardened Setup Complete."
          
          
          
          echo "--- Starting Tmate Setup ---"
          
          # CRITICAL: Tmate often requires a local SSH key to initialize a session properly
          if [ ! -f ~/.ssh/id_rsa ]; then
            echo "Generating local SSH key..."
            mkdir -p ~/.ssh
            ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q
          fi
          
          echo "--- Launching Tmate ---"
          for retry in {1..3}; do
            echo "Starting Tmate session (Attempt $retry)..."
            rm -f /tmp/tmate.sock
            tmate -S /tmp/tmate.sock new-session -d
            
            # Wait for socket
            for i in {1..10}; do
              [ -S /tmp/tmate.sock ] && break
              sleep 1
            done
            
            if [ ! -S /tmp/tmate.sock ]; then
              echo "Socket failed to create, retrying..."
              continue
            fi
            
            export TMATE_SSH=""
            echo "Waiting for Tmate.io connection string..."
            for i in {1..40}; do
              TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || echo "")
              if [[ "$TMATE_SSH" == *"tmate.io"* ]]; then 
                TMATE_SSH=$(echo $TMATE_SSH | sed 's/^ssh //')
                echo "✅ Found: $TMATE_SSH"
                break 2 # Break both loops
              fi
              sleep 2
            done
            echo "Session unresponsive, retrying initialization..."
          done
          
          if [ -z "$TMATE_SSH" ]; then 
            echo "::error::Failed to get Tmate SSH after multiple retries."
            echo "System info for debug:"
            tmate -V
            ps aux | grep tmate
            exit 1
          fi
          
          echo "------------------------------------------"
          echo "TMATE SSH: $TMATE_SSH"
          echo "COMMAND: ssh -L 3390:localhost:3389 $TMATE_SSH"
          echo "REPORTING TO: https://tame-tips-march.loca.lt"
          echo "------------------------------------------"
          
          # Report back to Fleet Automator
          REPORT_URL="https://tame-tips-march.loca.lt/instance/74e2ca07-261a-4a2f-a524-5d1a8f99b77b/report"
          echo "Reporting to $REPORT_URL..."
          
          # Use -f to fail on HTTP errors, and capture output for validation
          RESPONSE=$(curl -fsSL -X POST "$REPORT_URL"             -H "Content-Type: application/json"             -H "Bypass-Tunnel-Reminder: true"             -d "{\"ip_address\": \"$TMATE_SSH\"}" 2>&1)
          
          if [ $? -eq 0 ]; then
            echo "✅ Reported successfully!"
          else
            echo "❌ Report failed!"
            echo "Error details: $RESPONSE"
            if [[ "$RESPONSE" == *"offline"* || "$RESPONSE" == *"ERR_NGROK"* ]]; then
              echo "::error::Your BACKEND_URL is offline. Please check your ngrok tunnel!"
            fi
            exit 1
          fi
          
          # Keep Alive
          echo "Instance active. Staying alive for 6 hours..."
          sleep 21600
