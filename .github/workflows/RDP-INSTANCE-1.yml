name: "CloudRDP [14:27:33] - RDP-INSTANCE-1"
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      
      - name: Initialize & Report Tunnel (Bore)
        run: |
          # Download Bore binary
          curl -L https://github.com/ekoneko/bore/releases/latest/download/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/
          
          # Start Bore tunnel in background
          nohup bore local 3389 --to bore.pub > bore.log 2>&1 &
          
          # Wait for the tunnel to establish and extract the address
          for i in {1..20}; do
            TUNNEL_URL=$(grep -oE "bore.pub:[0-9]+" bore.log | head -n 1)
            if [ ! -z "$TUNNEL_URL" ]; then break; fi
            sleep 2
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "--- BORE LOG ---"
            cat bore.log
            echo "Failed to establish Bore tunnel."
            exit 1
          fi
          
          echo "Public RDP Address: $TUNNEL_URL"
          
          for i in {1..3}; do
            HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" -X POST "https://violet-books-divide.loca.lt/instance/6a897416-8041-47f8-aa00-a4398d1b19b1/report" -H "Content-Type: application/json" -H "Bypass-Tunnel-Reminder: true" -d "{\"ip_address\": \"$TUNNEL_URL\"}")
            if [ "$HTTP_STATUS" -eq 200 ]; then break; fi
            sleep 3
          done

      - name: Setup RDP
        run: bash scripts/RDP-INSTANCE-1_setup.sh

      - name: Report RDP Ready
        run: |
          for i in {1..3}; do
            HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" -X POST "https://violet-books-divide.loca.lt/instance/6a897416-8041-47f8-aa00-a4398d1b19b1/ready" -H "Content-Type: application/json" -H "Bypass-Tunnel-Reminder: true" -d "{\"status\": \"ready\"}")
            if [ "$HTTP_STATUS" -eq 200 ]; then break; fi
            sleep 3
          done
      
      - name: Keep Alive
        run: sleep 21600
