name: "CloudRDP [13:57:46] - RDP-INSTANCE-1"
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      
      - name: Initialize & Report Tmate
        run: |
          sudo apt-get update
          sudo apt-get install -y tmate
          ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q
          tmate -S /tmp/tmate.sock new-session -d
          for i in {1..30}; do
            TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null)
            [[ "$TMATE_SSH" == *"tmate.io"* ]] && break
            sleep 2
          done
          curl -sSL -k -X POST "https://curly-onions-travel.loca.lt/instance/055da160-6089-4fbe-a960-88ee456501cb/report" -H "Content-Type: application/json" -d "{\"ip_address\": \"$TMATE_SSH\"}"

      - name: Setup RDP
        run: bash scripts/RDP-INSTANCE-1_setup.sh

      - name: Report RDP Ready
        run: |
          curl -sSL -k -X POST "https://curly-onions-travel.loca.lt/instance/055da160-6089-4fbe-a960-88ee456501cb/ready" -H "Content-Type: application/json" -d "{\"status\": \"ready\"}"

      - name: Keep Alive
        run: sleep 21600
