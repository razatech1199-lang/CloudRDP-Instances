name: "CloudRDP [15:06:32] - RDP-INSTANCE-1"
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup RDP Environment
        run: |
          export BACKEND_URL="https://tender-wolves-vanish.loca.lt"
          export INSTANCE_ID="55297e71-cad4-40fd-b682-86295b16ba5c"
          bash scripts/RDP-INSTANCE-1_setup.sh

      - name: Report RDP Ready
        run: |
          for i in {1..5}; do
            HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" \
              -X POST "https://tender-wolves-vanish.loca.lt/instance/55297e71-cad4-40fd-b682-86295b16ba5c/ready" \
              -H "Content-Type: application/json" \
              -H "Bypass-Tunnel-Reminder: true" \
              -d '{"status": "ready"}')
            echo "Ready report attempt $i: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Ready signal sent successfully!"
              break
            fi
            sleep 3
          done

      - name: Keep Alive (6 hours)
        run: |
          echo "============================================"
          echo "  CloudRDP Instance Active"
          echo "  Instance: RDP-INSTANCE-1"
          echo "  ID: 55297e71-cad4-40fd-b682-86295b16ba5c"
          echo "  Session will expire in 6 hours."
          echo "============================================"
          sleep 21600
