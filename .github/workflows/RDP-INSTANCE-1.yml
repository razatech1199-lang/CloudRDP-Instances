
name: RDP-INSTANCE-1 - Ubuntu RDP
on:
  workflow_dispatch:
jobs:
  rdp-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Setup XFCE and XRDP (CloudRDP)
        run: |
          #!/bin/bash
          
          # CloudRDP Automated Setup Script
          # Description: Installs XFCE4 and XRDP for a remote desktop experience.
          # Compatibility: Ubuntu 20.04+, Debian 11+
          
          export DEBIAN_FRONTEND=noninteractive
          
          # 1. Update and Upgrade
          sudo apt-get update
          sudo apt-get upgrade -y
          
          # 2. Install XFCE4 Desktop Environment
          sudo apt-get install -y xfce4 xfce4-goodies
          
          # 3. Install XRDP
          sudo apt-get install -y xrdp
          
          # 4. Configure XRDP to use XFCE
          echo "startxfce4" > ~/.xsession
          sudo sed -i 's/^test -x \/etc\/X11\/Xsession && exec \/etc\/X11\/Xsession/exec startxfce4/g' /etc/xrdp/startwm.sh
          
          # 5. Fix for Polkit (Avoids authorization popups in RDP)
          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d/
          sudo bash -c 'cat > /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla <<EOF
          [Allow Colord all Users]
          Identity=unix-user:*
          Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
          ResultAny=no
          ResultInactive=no
          ResultActive=yes
          EOF'
          
          # 6. Set XRDP User Permissions
          sudo adduser xrdp ssl-cert
          
          # 7. Restart XRDP Service
          sudo service xrdp restart
          sleep 5
          sudo netstat -tuln | grep 3389 || echo "XRDP NOT LISTENING!"
          
          # 8. Firewall Configuration (UFW - Optional but safe)
          sudo ufw allow 3389/tcp || true
          
          # 9. Set Password for RDP Login
          # GitHub Actions default user is 'runner'
          echo "runner:CloudRDP2026!" | sudo chpasswd
          echo "root:CloudRDP2026!" | sudo chpasswd
          
          echo "CloudRDP: Setup Complete. Use port 3389 to connect."
          
      - name: Setup Ngrok Tunnel and Report
        run: |
          # Install Ngrok
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          
          # Start Ngrok
          ngrok config add-authtoken 3Ci4P8xk92EhzPNw8Qkcdc7kGgH_3nzbXHmwYFpnzzhUwyUVC
          ngrok tcp 3389 --log=stdout > ngrok.log &
          sleep 10
          
          # Extract TCP URL
          export NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "CLOUD_RDP_URL=$NGROK_URL" >> $GITHUB_ENV
          
          # Report back to backend
          if [ ! -z "0f87c147-c17e-4e95-8a14-fd4fad233312" ]; then
            curl -X POST "http://YOUR_NGROK_BACKEND_URL/instance/0f87c147-c17e-4e95-8a14-fd4fad233312/report?ip_address=$NGROK_URL"
          fi
          
          echo "------------------------------------------"
          echo "SUCCESS: Connect to $NGROK_URL"
          echo "------------------------------------------"
      - name: Keep Alive
        run: sleep 21600
