name: "CloudRDP [10:11:51] - RDP-INSTANCE-1"
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      
      - name: Initialize & Report Tmate
        run: |
          sudo apt-get update
          sudo apt-get install -y tmate
          ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q
          tmate -S /tmp/tmate.sock new-session -d
          for i in {1..30}; do
            TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null)
            [[ "$TMATE_SSH" == *"tmate.io"* ]] && break
            sleep 2
          done
          for i in {1..3}; do
            HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" -X POST "https://young-crabs-warn.loca.lt/instance/4d2ef7e8-9122-46f6-9a37-dfa115a7d68a/report" -H "Content-Type: application/json" -H "Bypass-Tunnel-Reminder: true" -d "{\"ip_address\": \"$TMATE_SSH\"}")
            if [ "$HTTP_STATUS" -eq 200 ]; then break; fi
            sleep 3
          done
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to report Tmate to backend. HTTP Status: $HTTP_STATUS"
            echo "Your backend URL (https://young-crabs-warn.loca.lt) might be unreachable or offline."
          fi

      - name: Setup RDP
        run: bash scripts/RDP-INSTANCE-1_setup.sh

      - name: Report RDP Ready
        run: |
          for i in {1..3}; do
            HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" -X POST "https://young-crabs-warn.loca.lt/instance/4d2ef7e8-9122-46f6-9a37-dfa115a7d68a/ready" -H "Content-Type: application/json" -H "Bypass-Tunnel-Reminder: true" -d "{\"status\": \"ready\"}")
            if [ "$HTTP_STATUS" -eq 200 ]; then break; fi
            sleep 3
          done
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to report RDP ready to backend. HTTP Status: $HTTP_STATUS"
            echo "Your backend URL (https://young-crabs-warn.loca.lt) might be unreachable or offline."
          fi

      - name: Keep Alive
        run: sleep 21600
