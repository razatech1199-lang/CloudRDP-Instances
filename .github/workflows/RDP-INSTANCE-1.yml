name: "CloudRDP [15:30:37] - RDP-INSTANCE-1"
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      
      - name: Setup RDP
        run: |
          export BACKEND_URL="https://giant-colts-cry.loca.lt"
          export INSTANCE_ID="0e4af3a4-c035-48aa-83a7-bf708f3800cc"
          bash scripts/RDP-INSTANCE-1_setup.sh

      - name: Report RDP Ready
        run: |
          for i in {1..3}; do
            HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" -X POST "https://giant-colts-cry.loca.lt/instance/0e4af3a4-c035-48aa-83a7-bf708f3800cc/ready" -H "Content-Type: application/json" -H "Bypass-Tunnel-Reminder: true" -d "{\"status\": \"ready\"}")
            if [ "$HTTP_STATUS" -eq 200 ]; then break; fi
            sleep 3
          done
      
      - name: Keep Alive
        run: sleep 21600
