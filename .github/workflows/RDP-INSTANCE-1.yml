name: "CloudRDP [16:09:51] - Ubuntu Instance"
on:
  workflow_dispatch:
jobs:
  rdp-instance:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Setup XFCE and XRDP
        run: |
          set -x
          #!/bin/bash
          
          # CloudRDP Optimized Setup Script (High-Speed Deployment)
          export DEBIAN_FRONTEND=noninteractive
          
          echo "--- [1/3] Installing Minimal Desktop & XRDP ---"
          # Combine all essential packages into one call to save time
          sudo apt-get update -qy
          sudo apt-get install -y --no-install-recommends \
              xfce4-session xfwm4 xfce4-panel xfce4-settings xfce4-terminal \
              dbus-x11 xrdp xorgxrdp tmate xinit
          
          # Configure XRDP to use XFCE
          USER_HOME=$(eval echo "~$(whoami)")
          echo "exec startxfce4" > $USER_HOME/.xsession
          chmod +x $USER_HOME/.xsession
          
          # Fix startwm.sh (Critical for Ubuntu runners)
          sudo sed -i 's/test -x \/etc\/X11\/Xsession \&\& exec \/etc\/X11\/Xsession/exec startxfce4/g' /etc/xrdp/startwm.sh
          sudo sed -i 's/exec \/bin\/sh \/etc\/X11\/Xsession/exec startxfce4/g' /etc/xrdp/startwm.sh
          
          # Allow any user to start X server
          sudo bash -c 'echo "allowed_users=anybody" > /etc/X11/Xwrapper.config'
          
          # Optimize XRDP configuration for performance
          sudo sed -i 's/^max_bpp=.*/max_bpp=16/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^crypt_level=.*/crypt_level=none/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^bitmap_cache=.*/bitmap_cache=yes/' /etc/xrdp/xrdp.ini
          sudo adduser xrdp ssl-cert 2>/dev/null || true
          
          # Fix Polkit to avoid "Authentication Required" popups
          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d/
          sudo bash -c 'cat <<EOF > /etc/polkit-1/localauthority/50-local.d/45-allow.pkla
          [Allow All]
          Identity=unix-user:*
          Action=org.freedesktop.*;org.debian.*
          ResultAny=yes
          ResultInactive=yes
          ResultActive=yes
          EOF'
          
          echo "--- [2/3] Finalizing Services ---"
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          
          echo "--- [3/3] Setting Credentials ---"
          CURRENT_USER=$(whoami)
          echo "$CURRENT_USER:CloudRDP2026!" | sudo chpasswd
          echo "root:CloudRDP2026!" | sudo chpasswd
          
          echo "CloudRDP: Setup Complete."
          
          
          
          echo "--- Starting Tmate Setup ---"
          
          # CRITICAL: Tmate often requires a local SSH key to initialize a session properly
          if [ ! -f ~/.ssh/id_rsa ]; then
            echo "Generating local SSH key..."
            mkdir -p ~/.ssh
            ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q
          fi
          
          echo "--- Launching Tmate ---"
          for retry in {1..3}; do
            echo "Starting Tmate session (Attempt $retry)..."
            rm -f /tmp/tmate.sock
            tmate -S /tmp/tmate.sock new-session -d
            
            # Wait for socket
            for i in {1..10}; do
              [ -S /tmp/tmate.sock ] && break
              sleep 1
            done
            
            if [ ! -S /tmp/tmate.sock ]; then
              echo "Socket failed to create, retrying..."
              continue
            fi
            
            export TMATE_SSH=""
            echo "Waiting for Tmate.io connection string..."
            for i in {1..40}; do
              TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || echo "")
              if [[ "$TMATE_SSH" == *"tmate.io"* ]]; then 
                TMATE_SSH=$(echo $TMATE_SSH | sed 's/^ssh //')
                echo "✅ Found: $TMATE_SSH"
                break 2 # Break both loops
              fi
              sleep 2
            done
            echo "Session unresponsive, retrying initialization..."
          done
          
          if [ -z "$TMATE_SSH" ]; then 
            echo "::error::Failed to get Tmate SSH after multiple retries."
            echo "System info for debug:"
            tmate -V
            ps aux | grep tmate
            exit 1
          fi
          
          echo "------------------------------------------"
          echo "TMATE SSH: $TMATE_SSH"
          echo "COMMAND: ssh -L 3390:localhost:3389 $TMATE_SSH"
          echo "REPORTING TO: https://little-schools-build.loca.lt"
          echo "------------------------------------------"
          
          # Report back to Fleet Automator
          REPORT_URL="https://little-schools-build.loca.lt/instance/529cb089-8a2d-4f34-b021-68132018287f/report"
          echo "Reporting to $REPORT_URL..."
          
          # Use -f to fail on HTTP errors, and capture output for validation
          RESPONSE=$(curl -fsSL -X POST "$REPORT_URL"             -H "Content-Type: application/json"             -H "Bypass-Tunnel-Reminder: true"             -d "{\"ip_address\": \"$TMATE_SSH\"}" 2>&1)
          
          if [ $? -eq 0 ]; then
            echo "✅ Reported successfully!"
          else
            echo "❌ Report failed!"
            echo "Error details: $RESPONSE"
            if [[ "$RESPONSE" == *"offline"* || "$RESPONSE" == *"ERR_NGROK"* ]]; then
              echo "::error::Your BACKEND_URL is offline. Please check your ngrok tunnel!"
            fi
            exit 1
          fi
          
          # Keep Alive
          echo "Instance active. Staying alive for 6 hours..."
          sleep 21600
