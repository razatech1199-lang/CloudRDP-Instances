name: "CloudRDP [11:11:34] - Ubuntu Instance"
on:
  workflow_dispatch:
jobs:
  rdp-instance:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Setup XFCE and XRDP
        run: |
          set -x
          #!/bin/bash
          
          # CloudRDP Nuclear Setup Script (Ultimate Compatibility Mode)
          export DEBIAN_FRONTEND=noninteractive
          
          echo "--- [1/4] Installing Full Desktop Suite ---"
          sudo apt-get update -qy
          # Remove --no-install-recommends to ensure all X11/DBUS bridges are present
          sudo apt-get install -y xfce4 xfce4-goodies xrdp xorgxrdp tmate xorg dbus-x11 x11-xserver-utils
          
          # Configure User Session
          USER_HOME=$(eval echo "~$(whoami)")
          echo "exec startxfce4" > $USER_HOME/.xsession
          echo "exec startxfce4" > $USER_HOME/.xsessionrc
          chmod +x $USER_HOME/.xsession $USER_HOME/.xsessionrc
          chown $(whoami):$(whoami) $USER_HOME/.xsession $USER_HOME/.xsessionrc
          
          # CRITICAL: Nuclear startwm.sh
          # This version is designed to bypass all Ubuntu session management hurdles
          sudo tee /etc/xrdp/startwm.sh <<EOF
          #!/bin/sh
          if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG
          fi
          
          # Essential environment cleanup for headless runners
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          unset XDG_SESSION_ID
          
          # Start XFCE directly
          test -x /usr/bin/startxfce4 && exec /usr/bin/startxfce4
          exec /bin/sh /etc/X11/Xsession
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh
          
          # Force Xorg backend and set security to a compatible mode
          sudo sed -i 's/^port=3389/port=3389\naddress=0.0.0.0/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^security_layer=.*/security_layer=rdp/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^crypt_level=.*/crypt_level=none/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^max_bpp=.*/max_bpp=24/' /etc/xrdp/xrdp.ini
          
          # Allow any user to start X server (headless fix)
          sudo bash -c 'echo "allowed_users=anybody" > /etc/X11/Xwrapper.config'
          sudo adduser xrdp ssl-cert 2>/dev/null || true
          
          # Finalizing Services ---
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sudo ufw allow 3389/tcp 2>/dev/null || true
          sleep 3
          
          echo "--- [3/4] Setting Credentials ---"
          CURRENT_USER=$(whoami)
          echo "$CURRENT_USER:CloudRDP2026!" | sudo chpasswd
          echo "root:CloudRDP2026!" | sudo chpasswd
          
          echo "--- [4/4] Final Diagnostic ---"
          sudo systemctl status xrdp --no-pager
          echo "CloudRDP: Nuclear Setup Complete."
          
          
          
          echo "--- Starting Tmate Setup ---"
          
          # CRITICAL: Tmate often requires a local SSH key to initialize a session properly
          if [ ! -f ~/.ssh/id_rsa ]; then
            echo "Generating local SSH key..."
            mkdir -p ~/.ssh
            ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q
          fi
          
          echo "--- Launching Tmate ---"
          for retry in {1..3}; do
            echo "Starting Tmate session (Attempt $retry)..."
            rm -f /tmp/tmate.sock
            tmate -S /tmp/tmate.sock new-session -d
            
            # Wait for socket
            for i in {1..10}; do
              [ -S /tmp/tmate.sock ] && break
              sleep 1
            done
            
            if [ ! -S /tmp/tmate.sock ]; then
              echo "Socket failed to create, retrying..."
              continue
            fi
            
            export TMATE_SSH=""
            echo "Waiting for Tmate.io connection string..."
            for i in {1..40}; do
              TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || echo "")
              if [[ "$TMATE_SSH" == *"tmate.io"* ]]; then 
                TMATE_SSH=$(echo $TMATE_SSH | sed 's/^ssh //')
                echo "✅ Found: $TMATE_SSH"
                break 2 # Break both loops
              fi
              sleep 2
            done
            echo "Session unresponsive, retrying initialization..."
          done
          
          if [ -z "$TMATE_SSH" ]; then 
            echo "::error::Failed to get Tmate SSH after multiple retries."
            echo "System info for debug:"
            tmate -V
            ps aux | grep tmate
            exit 1
          fi
          
          echo "------------------------------------------"
          echo "TMATE SSH: $TMATE_SSH"
          echo "COMMAND: ssh -L 3390:localhost:3389 $TMATE_SSH"
          echo "REPORTING TO: https://dark-schools-show.loca.lt"
          echo "------------------------------------------"
          
          # Report back to Fleet Automator
          REPORT_URL="https://dark-schools-show.loca.lt/instance/e94aed8e-7715-4a44-9c1d-aeeb52cf6530/report"
          echo "Reporting to $REPORT_URL..."
          
          # Use -f to fail on HTTP errors, and capture output for validation
          RESPONSE=$(curl -fsSL -X POST "$REPORT_URL"             -H "Content-Type: application/json"             -H "Bypass-Tunnel-Reminder: true"             -d "{\"ip_address\": \"$TMATE_SSH\"}" 2>&1)
          
          if [ $? -eq 0 ]; then
            echo "✅ Reported successfully!"
          else
            echo "❌ Report failed!"
            echo "Error details: $RESPONSE"
            if [[ "$RESPONSE" == *"offline"* || "$RESPONSE" == *"ERR_NGROK"* ]]; then
              echo "::error::Your BACKEND_URL is offline. Please check your ngrok tunnel!"
            fi
            exit 1
          fi
          
          # Keep Alive
          echo "Instance active. Staying alive for 6 hours..."
          sleep 21600
