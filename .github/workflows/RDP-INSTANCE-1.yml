name: "CloudRDP - Ubuntu Instance"
on:
  workflow_dispatch:
jobs:
  rdp-instance:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup XFCE and XRDP
        run: |
          #!/bin/bash
          
          # CloudRDP Automated Setup Script
          # Description: Installs XFCE4 and XRDP for a remote desktop experience.
          # Compatibility: Ubuntu 20.04+, Debian 11+
          
          export DEBIAN_FRONTEND=noninteractive
          
          # 1. Startup Delay and Update
          sleep 10
          sudo apt-get update
          
          # 2. Install XFCE4 Desktop Environment
          sudo apt-get install -y xfce4 xfce4-goodies dbus-x11
          
          # 3. Install XRDP
          sudo apt-get install -y xrdp
          
          # 4. Configure XRDP to use XFCE
          echo "exec startxfce4" > ~/.xsession
          chmod +x ~/.xsession
          sudo sed -i 's/^test -x \/etc\/X11\/Xsession && exec \/etc\/X11\/Xsession/exec startxfce4/g' /etc/xrdp/startwm.sh
          
          # 5. Fix for Polkit (Avoids authorization popups in RDP)
          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d/
          sudo bash -c 'echo "[Allow Colord all Users]" > /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla'
          sudo bash -c 'echo "Identity=unix-user:*" >> /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla'
          sudo bash -c 'echo "Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile" >> /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla'
          sudo bash -c 'echo "ResultAny=no" >> /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla'
          sudo bash -c 'echo "ResultInactive=no" >> /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla'
          sudo bash -c 'echo "ResultActive=yes" >> /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla'
          
          # 6. Set XRDP User Permissions and SSL
          sudo apt-get install -y ssl-cert
          sudo make-ssl-cert generate-default-snakeoil --force-overwrite
          sudo adduser xrdp ssl-cert
          
          # 7. Fix console session conflict (sesman.ini)
          sudo bash -c 'echo "" >> /etc/xrdp/sesman.ini'
          sudo bash -c 'echo "[Reconnect]" >> /etc/xrdp/sesman.ini'
          sudo bash -c 'echo "ReconnectScript=" >> /etc/xrdp/sesman.ini'
          sudo sed -i 's/^max_bpp=.*/max_bpp=24/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^security_layer=.*/security_layer=rdp/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^crypt_level=.*/crypt_level=none/' /etc/xrdp/xrdp.ini
          
          # 8. Restart XRDP Service
          sudo service xrdp restart
          sleep 5
          sudo netstat -tuln | grep 3389 || echo "XRDP NOT LISTENING!"
          
          # 8. Firewall Configuration (UFW - Optional but safe)
          sudo ufw allow 3389/tcp || true
          
          # 9. Set Password for RDP Login
          # GitHub Actions default user is 'runner'
          echo "runner:CloudRDP2026!" | sudo chpasswd
          echo "root:CloudRDP2026!" | sudo chpasswd
          
          echo "CloudRDP: Setup Complete. Use port 3389 to connect."
          
          
          # Setup Tmate Tunnel
          sudo apt update && sudo apt install tmate -y
          tmate -S /tmp/tmate.sock new-session -d
          until [ -S /tmp/tmate.sock ]; do sleep 1; done
          
          export TMATE_SSH=""
          for i in {1..100}; do
            TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || echo "")
            if [[ "$TMATE_SSH" == *"tmate.io"* ]]; then 
              TMATE_SSH=$(echo $TMATE_SSH | sed 's/^ssh //')
              break
            fi
            sleep 2
          done
          
          if [ -z "$TMATE_SSH" ]; then echo "Failed to get Tmate SSH"; exit 1; fi
          
          echo "------------------------------------------"
          echo "TMATE SSH: $TMATE_SSH"
          echo "COMMAND: ssh -L 3390:localhost:3389 $TMATE_SSH"
          echo "REPORTING TO: http://localhost:8000"
          echo "------------------------------------------"
          
          # Report back to Fleet Automator (JSON body to handle special chars in SSH string)
          curl -s -X POST "http://localhost:8000/instance/5bc41c1a-ae99-4041-98d7-ebf4ea66619f/report"             -H "Content-Type: application/json"             -d "{"ip_address": "$TMATE_SSH"}" && echo "Reported successfully!" || echo "Report failed - check BACKEND_URL"
          
          # Keep Alive
          echo "Instance active. Staying alive..."
          sleep 21600
