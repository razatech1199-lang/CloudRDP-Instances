name: "CloudRDP [15:18:01] - RDP-INSTANCE-1"
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      
      - name: Setup RDP
        run: |
          export BACKEND_URL="https://swift-walls-decide.loca.lt"
          export INSTANCE_ID="bb2335a7-45cd-4277-8737-17ea5c9b9e99"
          bash scripts/RDP-INSTANCE-1_setup.sh

      - name: Report RDP Ready
        run: |
          for i in {1..3}; do
            HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" -X POST "https://swift-walls-decide.loca.lt/instance/bb2335a7-45cd-4277-8737-17ea5c9b9e99/ready" -H "Content-Type: application/json" -H "Bypass-Tunnel-Reminder: true" -d "{\"status\": \"ready\"}")
            if [ "$HTTP_STATUS" -eq 200 ]; then break; fi
            sleep 3
          done
      
      - name: Keep Alive
        run: sleep 21600
