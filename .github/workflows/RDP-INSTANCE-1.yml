name: "CloudRDP [14:24:05] - RDP-INSTANCE-1"
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      
      - name: Initialize & Report Tunnel (Serveo/Pinggy)
        run: |
          ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q
          # Try Serveo first as it's often more reliable for TCP
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -f -N -R 0:localhost:3389 serveo.net 2>&1 | tee tunnel.log &
          
          for i in {1..20}; do
            TUNNEL_URL=$(grep -oE "serveo.net:[0-9]+" tunnel.log | head -n 1)
            if [ ! -z "$TUNNEL_URL" ]; then break; fi
            # Fallback to Pinggy if Serveo is slow
            if [ $i -eq 10 ]; then
               ssh -o StrictHostKeyChecking=no -p 443 -f -N -R 0:localhost:3389 tcp@pinggy.io 2>&1 | tee -a tunnel.log &
            fi
            TUNNEL_URL=$(grep -oE "tcp.pinggy.io:[0-9]+" tunnel.log | head -n 1)
            if [ ! -z "$TUNNEL_URL" ]; then break; fi
            sleep 2
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "--- TUNNEL LOG ---"
            cat tunnel.log
            echo "Failed to establish any tunnel."
            exit 1
          fi
          
          echo "Public RDP Address: $TUNNEL_URL"
          
          for i in {1..3}; do
            HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" -X POST "https://clear-shoes-marry.loca.lt/instance/263853be-a31e-4f00-b099-7d7d7b195d92/report" -H "Content-Type: application/json" -H "Bypass-Tunnel-Reminder: true" -d "{\"ip_address\": \"$TUNNEL_URL\"}")
            if [ "$HTTP_STATUS" -eq 200 ]; then break; fi
            sleep 3
          done

      - name: Setup RDP
        run: bash scripts/RDP-INSTANCE-1_setup.sh

      - name: Report RDP Ready
        run: |
          for i in {1..3}; do
            HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" -X POST "https://clear-shoes-marry.loca.lt/instance/263853be-a31e-4f00-b099-7d7d7b195d92/ready" -H "Content-Type: application/json" -H "Bypass-Tunnel-Reminder: true" -d "{\"status\": \"ready\"}")
            if [ "$HTTP_STATUS" -eq 200 ]; then break; fi
            sleep 3
          done
      
      - name: Keep Alive
        run: sleep 21600
