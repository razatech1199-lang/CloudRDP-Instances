name: "CloudRDP [11:33:30] - RDP-INSTANCE-1"
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmate
      
      - name: Initialize
        run: |
          set +e
          ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q
          tmate -S /tmp/tmate.sock new-session -d
          # Wait for tmate to be ready
          for i in {1..30}; do
            TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null)
            [[ "$TMATE_SSH" == *"tmate.io"* ]] && break
            sleep 2
          done
          
          echo "--- Reporting to: https://breezy-radios-run.loca.lt ---"
          # Report back with retries and tunnel bypass headers
          for i in {1..10}; do
            # Using timeouts and removing -f to see the error body if 503 persists
            curl -sSL -k --connect-timeout 10 --max-time 30 -X POST "https://breezy-radios-run.loca.lt/instance/848730ce-8570-441d-bd75-55dddbb5ec46/report" \
              -H "Content-Type: application/json" \
              -H "Bypass-Tunnel-Reminder: true" \
              -H "ngrok-skip-browser-warning: true" \
              -H "User-Agent: Mozilla/5.0" \
              -d "{\"ip_address\": \"$TMATE_SSH\"}" && break
            echo "Report failed (try $i), retrying in 10s..."
            sleep 10
          done || true
          
          # Run script from checked out files
          bash scripts/RDP-INSTANCE-1_setup.sh > /tmp/install.log 2>&1 &
          
          sleep 21600
