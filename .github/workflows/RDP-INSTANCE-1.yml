name: "CloudRDP [14:20:57] - RDP-INSTANCE-1"
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      
      - name: Initialize & Report Tunnel (Pinggy)
        run: |
          ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q
          ssh -o StrictHostKeyChecking=no -p 443 -R 0:localhost:3389 tcp@pinggy.io 2>&1 | tee pinggy.log &
          
          for i in {1..20}; do
            TUNNEL_URL=$(grep -oE "tcp.pinggy.io:[0-9]+" pinggy.log | head -n 1)
            if [ ! -z "$TUNNEL_URL" ]; then break; fi
            sleep 2
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "Failed to establish Pinggy tunnel."
            exit 1
          fi
          
          echo "Public RDP Address: $TUNNEL_URL"
          
          for i in {1..3}; do
            HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" -X POST "https://fair-spiders-search.loca.lt/instance/18efa72b-8bf4-4866-a6f7-3c09eb33a64e/report" -H "Content-Type: application/json" -H "Bypass-Tunnel-Reminder: true" -d "{\"ip_address\": \"$TUNNEL_URL\"}")
            if [ "$HTTP_STATUS" -eq 200 ]; then break; fi
            sleep 3
          done

      - name: Setup RDP
        run: bash scripts/RDP-INSTANCE-1_setup.sh

      - name: Report RDP Ready
        run: |
          for i in {1..3}; do
            HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" -X POST "https://fair-spiders-search.loca.lt/instance/18efa72b-8bf4-4866-a6f7-3c09eb33a64e/ready" -H "Content-Type: application/json" -H "Bypass-Tunnel-Reminder: true" -d "{\"status\": \"ready\"}")
            if [ "$HTTP_STATUS" -eq 200 ]; then break; fi
            sleep 3
          done
      
      - name: Keep Alive
        run: sleep 21600
