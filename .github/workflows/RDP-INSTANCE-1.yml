name: "CloudRDP [09:17:32] - RDP-INSTANCE-1"
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmate
      
      - name: Initialize
        run: |
          set +e
          ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q
          tmate -S /tmp/tmate.sock new-session -d
          for i in {1..30}; do
            TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null)
            [[ "$TMATE_SSH" == *"tmate.io"* ]] && break
            sleep 2
          done
          
          curl -fsSL -X POST "https://breezy-radios-run.loca.lt/instance/8b1b23f4-45bf-4cf0-890c-cafc3aa9b494/report" \
            -H "Content-Type: application/json" \
            -d "{\"ip_address\": \"$TMATE_SSH\"}" || true
          
          # Run script from checked out files
          bash scripts/RDP-INSTANCE-1_setup.sh > /tmp/install.log 2>&1 &
          
          sleep 21600
