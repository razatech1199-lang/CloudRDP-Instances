name: "CloudRDP [14:33:42] - RDP-INSTANCE-1"
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      
      - name: Initialize & Report Tmate
        run: |
          sudo apt-get update
          sudo apt-get install -y tmate
          ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q
          tmate -S /tmp/tmate.sock new-session -d
          for i in {1..30}; do
            TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null)
            [[ "$TMATE_SSH" == *"tmate.io"* ]] && break
            sleep 2
          done
          HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" -X POST "https://bumpy-peas-tan.loca.lt/instance/34cc5822-6cce-4141-9d0a-0c41376431ab/report" -H "Content-Type: application/json" -d "{\"ip_address\": \"$TMATE_SSH\"}")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to report Tmate to backend. HTTP Status: $HTTP_STATUS"
            echo "Your backend URL (https://bumpy-peas-tan.loca.lt) might be unreachable or offline."
          fi

      - name: Setup RDP
        run: bash scripts/RDP-INSTANCE-1_setup.sh

      - name: Report RDP Ready
        run: |
          HTTP_STATUS=$(curl -sSL -k -o /dev/null -w "%{http_code}" -X POST "https://bumpy-peas-tan.loca.lt/instance/34cc5822-6cce-4141-9d0a-0c41376431ab/ready" -H "Content-Type: application/json" -d "{\"status\": \"ready\"}")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to report RDP ready to backend. HTTP Status: $HTTP_STATUS"
            echo "Your backend URL (https://bumpy-peas-tan.loca.lt) might be unreachable or offline."
          fi

      - name: Keep Alive
        run: sleep 21600
